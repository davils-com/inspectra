name: inspectra
description: >-
  Enterprise software assurance and supply-chain security for Dart and
  Flutter: OSV.dev audit, package source inspection, trust and typosquat
  analysis, safe dependency installation, Git hooks, Trivy scans with
  automatic provisioning, format and lint gates, public API dumps and
  coverage.
version: 2.1.0
repository: https://github.com/davils-com/Inspectra
issue_tracker: https://github.com/davils-com/Inspectra/issues
documentation: https://davils-com.github.io/Inspectra
homepage: https://www.davils.com
topics:
  - security
  - supply-chain
  - coverage
  - secret-scanning
  - api-surface

environment:
  sdk: ^3.13.4

dependencies:
  analyzer: ^14.4.0
  archive: ^4.0.7
  args: ^2.7.0
  build: ^5.0.0
  coverage: ^1.15.1
  crypto: ^3.0.6
  glob: ^2.2.0
  path: ^1.9.1
  pub_semver: ^2.2.0
  xml: ^7.1.0
  yaml: ^3.1.4
  yaml_edit: ^2.2.4

dev_dependencies:
  build_runner: ^2.17.1
  build_test: ^3.5.23
  lints: ^6.1.0
  test: ^1.30.0

executables:
  inspectra:

# Inspectra checks itself with every feature it ships. See docs/ and
# inspectra.example.yaml for what each option does.
inspectra:
  format:
    enabled: true
    run_on_build: true
  lint:
    enabled: true
    run_on_build: true
  # The code rules of AGENTS.md: every built-in rule, and the Apache-2.0
  # header of tool/license_header.txt.
  style:
    enabled: true
    run_on_build: true
    preset: strict
    license_header: tool/license_header.txt
  api:
    enabled: true
  trivy:
    enabled: true
    license:
      run_on_build: true
      # package:archive bundles a decoder under the permissive bzip2-1.0.6
      # license (BSD-style), which Trivy cannot classify.
      ignored_licenses: [bzip2]
    vulnerability:
      run_on_build: true
    filesystem:
      enabled: true
      scanners: [vuln, secret, misconfig]
  coverage:
    enabled: true
    min_line_coverage: 90
  changelog:
    enabled: true
  # The dependency rules Inspectra holds itself to; it is the one package
  # meant for pub.dev.
  dependency_policy:
    enabled: true
    require_upper_bound: true
    min_sdk: 3.13.4
    dev_only: [build_runner, build_test, lints, test]
    require_publish_to: true
    published_packages: [inspectra]
    check_imports: true
