# yaml-language-server: $schema=https://raw.githubusercontent.com/davils-com/workflows/develop/schemas/davils-ci.schema.json
#
# What Inspectra's CI does differently from the defaults of davils-com/workflows. Every option is
# in the configuration reference of davils-com/workflows.
version: 1

dart:
  # The newest SDK and the lowest one pubspec.yaml allows (3.13.4), on every operating system.
  sdks: [stable, lowest]
  os: [ubuntu, macos, windows]
  # The Inspectra job runs build_runner build --only-check before inspectra check.
  build-runner:
    enabled: false
  # pub warns about the top-level docs directory of the Writerside documentation; releases go to
  # GitHub, so the dry run of a pub.dev publication is off, as before.
  publish-dry-run:
    enabled: false

hooks:
  # As before: Inspectra provisions the Trivy its integration tests run against (checksum
  # verified) and puts it on the PATH, not into INSPECTRA_TRIVY, which would override the fake
  # Trivy executables of the unit tests. Not on Windows, where those tests skip Trivy.
  pre-test: |
    if [[ "$RUNNER_OS" != Windows ]]; then
      dart run bin/inspectra.dart trivy --install --format json --output "$RUNNER_TEMP/trivy.json"
      dirname "$(jq -r .trivy.executable "$RUNNER_TEMP/trivy.json")" >>"$GITHUB_PATH"
    fi

inspectra:
  # The repository checks itself with its own source: dart run inspectra.
  install: auto
  scan:
    fail-on: high
  trivy:
    mode: required

writerside:
  instances: [docs/d]

timeouts:
  # inspectra check runs the whole suite with coverage and every Trivy scan.
  inspectra: 60

build:
  dart-compile:
    targets: [linux-x64, linux-arm64, macos-arm64, macos-x64, windows-x64]
    smoke-test-args: --version
    # Every push compiles the executables, as a check that they still build.
    when:
      events: [push, pull_request, merge_group, workflow_dispatch]
      branches: []

release:
  tag-patterns:
    single: v{version}
    package: ''
  pub:
    # Releases go to GitHub; publishing to pub.dev stays a manual step until automated
    # publishing is set up on pub.dev for this repository.
    enabled: false
  github:
    # inspectra changelog notes <version>; the release stops when the section is missing.
    notes-source: inspectra
