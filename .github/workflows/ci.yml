name: CI

# Everything runs through the pipeline of davils-com/workflows: the tests on Linux, macOS and
# Windows (stable and the lowest SDK of pubspec.yaml), Inspectra on itself (build_runner
# --only-check, inspectra check with the 90 % coverage gate, inspectra scan with code scanning),
# the native executables, the Writerside documentation and the API reference on GitHub Pages and,
# on a tag v<version>, the GitHub release with the binaries, checksums.txt and the notes of
# CHANGELOG.md. .github/davils-ci.yaml holds what differs from the defaults.
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
    branches: [main, develop]
    types: [opened, edited, synchronize, reopened]
  merge_group:
  schedule:
    # New vulnerabilities are published for dependencies nobody touched.
    - cron: '0 4 * * 1'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions: {}

jobs:
  pipeline:
    name: Pipeline
    uses: davils-com/workflows/.github/workflows/pipeline.yml@7777dbd99d61d25cc0eaee8592043bd609e67f85 # develop
    # GitHub checks the permissions of every job the pipeline could run before it starts, so it
    # gets all of them; every job inside takes only what it needs.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      checks: write
      security-events: write
      pages: write
      id-token: write
      attestations: write
    secrets: inherit
