# yaml-language-server: $schema=https://raw.githubusercontent.com/davils-com/Inspectra/main/inspectra.schema.json
# Inspectra configuration with every option and its default.
#
# Put these keys into inspectra.yaml next to pubspec.yaml, or under an
# `inspectra:` section of pubspec.yaml. Precedence (highest first):
# --set key=value and dedicated flags, INSPECTRA_<PATH> environment variables
# (e.g. INSPECTRA_TRIVY_VERSION, INSPECTRA_NETWORK_PROXY), this file, the
# bases it extends, defaults. Unknown keys are rejected.

# Shared configurations this file builds on, from the lowest to the highest
# precedence: paths relative to this file, package:<name>/<path> through
# .dart_tool/package_config.json, or https URLs pinned by their SHA-256.
# extends:
#   - package:acme_policy/inspectra.yaml
#   - url: https://policy.acme.corp/inspectra.yaml
#     sha256: <64 hexadecimal digits>

# Named partial configurations, applied with --profile <name> or
# INSPECTRA_PROFILE above this file and below INSPECTRA_* variables and the
# command line. A profile cannot set extends, policy or profiles.
# profiles:
#   ci:
#     fail_on: low
#   local:
#     network:
#       offline: true

# Options that files extending this one, INSPECTRA_* variables and the command
# line must not change (locked), or may only make stricter (minimum), and the
# severities of findings no ignore rule, --ignore flag or baseline may hide.
# policy:
#   locked: [trivy.secret.enabled]
#   minimum:
#     coverage.min_line_coverage: 70
#     fail_on: high
#   forbid_ignore_of: [critical]

# ---------------------------------------------------------------------------
# Supply-chain commands: scan, audit, inspect, trust, typosquat, add, hook
# ---------------------------------------------------------------------------

# Minimum severity that makes a command exit with 1. Unset: the command's own
# default (any finding for scan/audit/trivy, high for typosquat, critical for
# trust). One of critical, high, medium, low, unknown.
# fail_on: high

# Findings below this severity are not reported at all.
min_severity: unknown

# Documented suppressions. A reason is mandatory; expired rules stop matching.
ignore:
  - id: GHSA-xxxx-yyyy-zzzz          # rule id, advisory id or alias (CVE)
    package: http                    # optional: only for this package
    reason: Not reachable, we never parse untrusted multipart bodies.
    expires: 2027-01-31              # optional: revisit after this day

# The findings accepted for now, recorded by `inspectra baseline create` and
# left out by scan, audit, typosquat, trivy, lint, style, check and the
# builders; `inspectra baseline prune` removes the fixed ones.
baseline:
  enabled: true                      # apply the file when it exists
  file: inspectra-baseline.json
  # max_severity: high               # unset: cover every severity
  fail_on_stale: false               # true: fail until fixed findings are pruned

# Rules for the dependencies of every pubspec.yaml, checked by scan, deps and
# check once enabled; `inspectra deps --fix` applies the fixable ones.
dependency_policy:
  enabled: false
  denied: []                         # entries: name, reason, replacement
  allowed: []                        # not empty: the only hosted packages allowed
  allowed_hosts: []                  # e.g. [https://pub.corp, https://pub.dev]
  allowed_git_hosts: []              # e.g. [git.corp]
  require_upper_bound: false         # >=1.2.0 needs an upper bound
  # min_sdk: 3.6.0                   # lowest allowed lower bound of environment.sdk
  # min_flutter: 3.27.0              # the same for environment.flutter
  dev_only: []                       # e.g. [mockito, build_runner, lints, test]
  require_publish_to: false          # every package needs publish_to ...
  published_packages: []             # ... except the ones meant for pub.dev
  required_metadata: []              # description, repository, homepage, issue_tracker, documentation, topics
  lockfile_in_sync: false            # pubspec.lock matches the direct dependencies
  lockfile_checksums: false          # every hosted package has a sha256
  check_imports: false               # unused dependencies, dev dependencies used by lib/
  unused_allow: [cupertino_icons]
  constraint_style: any              # any, caret (^1.2.0), range (>=1.2.0 <2.0.0) or pinned (1.2.3)
  overrides:
    require_reason: false            # every dependency override needs an entry in allowed
    allowed: []                      # entries: name, reason, expires
  lockfile_policy: any               # any, committed, ignored, or auto: apps commit, libraries do not
  # max_major_behind: 1              # breaking releases a direct dependency may be behind (deps --online)
  # max_libyear: 10                  # years all dependencies may be behind together (deps --online)
  libyear_scope: direct              # direct, or all to count transitive packages

# The pre-commit hook of `inspectra hook install`: the checks `hook run` applies
# to the staged files. One of audit, typosquat, deps, format, style.
hook:
  checks: [audit, typosquat]

# Rules for the packages of a pub workspace, checked by `deps -r` and `check`
# at the workspace root.
workspace_policy:
  enabled: false
  align_versions: compatible         # off, compatible (one common version) or exact (same text)
  require_membership: true           # listed entries exist, members use resolution: workspace
  same_sdk: false                    # every package has the root's environment.sdk
  forbid_cycles: true                # packages must not depend on each other in a cycle
  include_dev_dependencies: false    # dev_dependencies count for cycles and layers
  layers: []                         # entries: name, packages (globs), may_depend_on, isolated, forbidden_dependencies

network:
  offline: false                     # true: never open a connection
  timeout: 30s
  max_attempts: 3                    # retries with back-off and Retry-After
  retry_base_delay: 1s
  concurrency: 8
  # proxy: http://proxy.corp:3128    # default: HTTPS_PROXY / HTTP_PROXY / NO_PROXY
  # ca_certificates: certs/corp-ca.pem
  osv_url: https://api.osv.dev
  # pub_hosted_url: https://pub.dev  # default: PUB_HOSTED_URL or https://pub.dev

inspect:
  fail_score: 30                     # risk score at which inspect fails and add blocks
  max_archive_bytes: 67108864
  max_extracted_bytes: 268435456
  max_entries: 20000
  entropy_excludes: [.g.dart, .freezed.dart, .mocks.dart, .pb.dart, .gr.dart]
  exclude_directories: [test, integration_test, example, benchmark, doc, docs, tool, extension]
  trusted_hosts: []                  # extra hosts the URL rule never reports

trust:
  fresh_package_days: 7
  young_package_days: 30
  fresh_release_hours: 24
  min_likes: 5
  min_downloads: 100
  min_points_ratio: 0.5

typosquat:
  allow: []                          # names never reported
  popular: []                        # extra names to protect, e.g. internal packages

# ---------------------------------------------------------------------------
# Trivy: provisioning (all commands) and the configured scans (check, trivy,
# build_runner)
# ---------------------------------------------------------------------------

trivy:
  enabled: false                     # run the configured scans in check/trivy/builders
  mode: auto                         # auto | required | disabled
  version: 0.75.0                    # exact version or "latest"
  use_installed: true                # use an installed Trivy even if its version differs
  download: true                     # download Trivy when missing (only when online)
  # executable: /opt/trivy/trivy     # use exactly this binary; INSPECTRA_TRIVY overrides it
  # install_directory: .tools/trivy  # default: <user cache>/inspectra/trivy
  download_base_url: https://github.com/aquasecurity/trivy/releases/download
  latest_release_url: https://github.com/aquasecurity/trivy/releases/latest
  report_directory: .dart_tool/inspectra/trivy
  skip_db_update: false
  # db_repository: registry.corp/aquasecurity/trivy-db
  # cache_directory: .cache/trivy
  timeout: 10m
  connectivity_timeout: 3s
  extra_args: []

  secret:
    enabled: true
    run_on_build: true
    fail_on_findings: true
    severity: [CRITICAL, HIGH, MEDIUM, LOW]
    # config: trivy-secret.yaml      # used when present; required when set explicitly
    include: ['**.dart', '**.yaml', '**.yml', '**.json', '**.env', '**.properties']
    exclude: ['**/.dart_tool/**', '**/build/**', '**/.git/**']

  license:
    enabled: true
    run_on_build: false
    fail_on_findings: true
    severity: [CRITICAL, HIGH, UNKNOWN]
    ignored_licenses: []             # SPDX ids, e.g. [LGPL-3.0]
    ignored_packages: []
    include_dev_dependencies: false

  vulnerability:
    enabled: true
    run_on_build: false
    fail_on_findings: true
    severity: [CRITICAL, HIGH, MEDIUM, LOW]
    include_dev_dependencies: true
    ignore_unfixed: false
    ignored_vulnerabilities: []      # CVE or GHSA ids

  filesystem:                        # also used by `inspectra scan`
    enabled: false
    fail_on_findings: true
    severity: [CRITICAL, HIGH, MEDIUM, LOW]
    scanners: [vuln, secret, misconfig]   # also: license
    skip_dirs: [.dart_tool, build, .git]

# ---------------------------------------------------------------------------
# Package quality gates: check, format, lint, style, api, coverage
# ---------------------------------------------------------------------------

format:
  enabled: false
  run_on_build: false
  fail_on_findings: true
  include: ['**.dart']
  exclude: ['**/.dart_tool/**', '**/build/**', '**.g.dart', '**.freezed.dart', '**.mocks.dart']
  # page_width: 80                   # unset: formatter.page_width of analysis_options.yaml

lint:
  enabled: false
  run_on_build: false
  fail_on: info                      # error, warning, info or none

style:
  enabled: false
  run_on_build: false
  fail_on_findings: true
  preset: recommended                # none, recommended or strict
  # Switch single built-in or custom rules on or off; wins over the preset.
  # Built-in: license_header, public_docs, private_docs, one_type_per_file,
  # one_public_type_per_file, file_named_after_type, no_comments, no_else,
  # no_default_case, no_wildcard_case, no_late, and no_platform_imports,
  # no_material and no_wall_clock, which no preset turns on.
  rules: {}
  # license_header: tool/license_header.txt   # unset: no license_header rule
  custom_rules: []                   # files with a top level styleRules list
  include: ['**.dart']
  exclude: ['**/.dart_tool/**', '**/build/**', '**.g.dart', '**.freezed.dart', '**.mocks.dart']

api:
  enabled: false
  # output: api/<package>.api        # the committed dump
  ignored_libraries: []
  non_public_annotations: [internal, visibleForTesting]
  # Whether check also compares the API with the dump committed at the last
  # release tag and requires a matching version in pubspec.yaml.
  semver: false

coverage:
  enabled: false
  runner: dart                       # or flutter
  output_directory: coverage
  report_on: [lib]
  exclude: ['**.g.dart', '**.freezed.dart', '**.mocks.dart']
  # min_line_coverage: 80            # unset: report only
  test_arguments: []
  merge: []                          # further runs: name, test_arguments; see Coverage-Configuration

# ---------------------------------------------------------------------------
# Changelog: changelog generate, changelog check (also run by check when
# enabled), changelog notes
# ---------------------------------------------------------------------------

changelog:
  enabled: false                     # whether check validates the changelog
  file: CHANGELOG.md
  tag_prefix: v                      # release tags look like v1.2.3; '' for 1.2.3
  # Section of each Conventional Commits type: added, changed, deprecated,
  # removed, fixed, security or hidden. Listed keys replace the defaults
  # below; types that are not listed are hidden. Breaking changes are always
  # listed.
  types:
    feat: added
    fix: fixed
    perf: changed
    refactor: changed
    revert: changed
    deprecate: deprecated
    remove: removed
    security: security
    docs: hidden
    style: hidden
    test: hidden
    build: hidden
    ci: hidden
    chore: hidden
  unconventional: hidden             # section of commits without a type
  # repository: https://github.com/acme/demo   # unset: repository of pubspec.yaml
  commit_url: '{repository}/commit/{hash}'
  compare_url: '{repository}/compare/{from}...{to}'
